<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* =========================================================
   BODY
   ========================================================= */

html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#020803;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  color:#fff;

}


/* =========================================================
   CARGANDO CHAT
   ========================================================= */

#loading{

  position:fixed;

  inset:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:14px;

  background:#020803;

  color:#fff;

  font-size:15px;

  font-weight:600;

  z-index:9998;

}


/* =========================================================
   SPINNER
   ========================================================= */

.spinner{

  width:28px;

  height:28px;

  border:
    3px solid
    rgba(255,255,255,0.15);

  border-top-color:#39FF6A;

  border-radius:50%;

  animation:
    spin 0.8s linear infinite;

}


@keyframes spin{

  to{

    transform:rotate(360deg);

  }

}


/* =========================================================
   CHATWEB KOMMO
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:
    rgba(0,5,2,0.97);

  visibility:hidden;

  opacity:0;

  transition:

    opacity 0.1s ease,

    visibility 0.1s ease;

  z-index:9999;

}


/* =========================================================
   CHAT ABIERTO
   ========================================================= */

#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


/* =========================================================
   IFRAME KOMMO
   ========================================================= */

#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

}

</style>

</head>


<body>


<!-- =========================================================
     PANTALLA DE CARGA
     ========================================================= -->

<div id="loading">

  <div class="spinner"></div>

  <div>
    Cargando chat...
  </div>

</div>


<!-- =========================================================
     CHATWEB
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loading =
  document.getElementById(
    'loading'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT REAL
   ========================================================= */

function openReal(){

  /*
   * Mostrar ChatWeb
   */

  frame.classList.add(
    'is-open'
  );


  /*
   * Ocultar pantalla
   * "Cargando chat..."
   */

  loading.style.display =
    'none';


  /*
   * Abrir ChatWeb Kommo
   */

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '========================================'
    );

    console.log(
      '✅ GREEN BET CHATWEB ABIERTO AUTOMÁTICAMENTE'
    );

    console.log(
      '========================================'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO GREEN BET CHATWEB:',
      error
    );

  }

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB GREEN BET...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB GREEN BET LISTO'
      );


      /*
       * ABRIR AUTOMÁTICAMENTE
       */

      openReal();

    }
  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>


</body>
</html>
