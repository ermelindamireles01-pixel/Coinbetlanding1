<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  font-family:

    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:#020803;

  color:#fff;

}


/* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

.wrapper{

  width:100%;

  height:100dvh;

  max-width:480px;

  margin:0 auto;

  display:flex;

  flex-direction:column;

  background:

    radial-gradient(
      circle at 50% 0%,
      rgba(30,255,90,0.10),
      transparent 35%
    ),

    #020803;

}


/* =========================================================
   HERO
   ========================================================= */

.hero{

  flex:1;

  position:relative;

  overflow:hidden;

  min-height:0;

  background:#020803;

}


/*
   Imagen vertical GREEN BET

   IMPORTANTE:
   Guardá la imagen generada como:

   greenbet-hero.jpg
*/

.hero img{

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

  object-position:center center;

}


/* =========================================================
   EFECTO DE LUZ SOBRE EL HERO
   ========================================================= */

.hero::after{

  content:"";

  position:absolute;

  left:0;

  right:0;

  bottom:0;

  height:22%;

  pointer-events:none;

  background:

    linear-gradient(
      to bottom,
      transparent,
      rgba(2,8,3,0.20),
      rgba(2,8,3,0.92)
    );

}


/* =========================================================
   BARRA INFERIOR
   ========================================================= */

.cta-bar{

  position:relative;

  background:

    linear-gradient(
      180deg,
      #071509 0%,
      #020803 100%
    );

  padding:10px 14px 14px;

  border-top:

    1px solid
    rgba(57,255,106,0.45);

  flex-shrink:0;

  box-shadow:

    0 -8px 30px
    rgba(0,0,0,0.65);

}


/* =========================================================
   ESTADO ONLINE
   ========================================================= */

.ops{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-bottom:6px;

  font-size:11px;

  color:#8cffaa;

  font-weight:700;

  letter-spacing:.2px;

}


.ops::before{

  content:'';

  width:7px;

  height:7px;

  border-radius:50%;

  background:#39FF6A;

  box-shadow:

    0 0 7px
    rgba(57,255,106,0.9),

    0 0 15px
    rgba(57,255,106,0.45);

  animation:pulseDot 1.4s infinite;

}


/* =========================================================
   BONO
   ========================================================= */

.bonus-line{

  text-align:center;

  margin-bottom:8px;

}


.bonus-line .label{

  font-size:9px;

  letter-spacing:2px;

  color:#a7ffb8;

  text-transform:uppercase;

  font-weight:800;

}


.bonus-line .value{

  font-size:23px;

  line-height:1.05;

  font-weight:950;

  color:#FFD84A;

  text-shadow:

    0 0 8px
    rgba(255,216,74,0.45),

    0 0 20px
    rgba(57,255,106,0.22);

  animation:glowText 2.4s ease-in-out infinite;

}


.bonus-line .sub{

  margin-top:2px;

  font-size:10px;

  color:#9caea1;

}


/* =========================================================
   BOTÓN CHAT
   ========================================================= */

.wa-btn{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  padding:14px 16px;

  border:

    1px solid
    rgba(120,255,150,0.75);

  border-radius:13px;

  cursor:pointer;

  background:

    linear-gradient(
      135deg,
      #0bdc50 0%,
      #38ff72 42%,
      #19b947 100%
    );

  color:#021006;

  font-size:15px;

  font-weight:950;

  letter-spacing:.2px;

  box-shadow:

    0 5px 20px
    rgba(30,255,85,0.32),

    inset 0 1px 0
    rgba(255,255,255,0.35);

  animation:

    shake 3s ease-in-out infinite,

    glowBtn 2.2s ease-in-out infinite;

}


.wa-btn:active{

  transform:scale(0.97);

  animation:none;

}


.wa-btn svg{

  width:22px;

  height:22px;

  flex-shrink:0;

  fill:#021006;

}


/* =========================================================
   TEXTO FINAL
   ========================================================= */

.footer-text{

  text-align:center;

  margin-top:7px;

  font-size:9px;

  color:#637268;

}


/* =========================================================
   ANIMACIONES
   ========================================================= */

@keyframes shake{

  0%,
  100%{

    transform:translateX(0);

  }

  8%{

    transform:translateX(-3px);

  }

  16%{

    transform:translateX(3px);

  }

  24%{

    transform:translateX(-2px);

  }

  32%{

    transform:translateX(2px);

  }

  40%{

    transform:translateX(0);

  }

}


@keyframes glowBtn{

  0%,
  100%{

    box-shadow:

      0 5px 20px
      rgba(30,255,85,0.28),

      inset 0 1px 0
      rgba(255,255,255,0.35);

  }

  50%{

    box-shadow:

      0 7px 30px
      rgba(30,255,85,0.52),

      0 0 12px
      rgba(57,255,106,0.25),

      inset 0 1px 0
      rgba(255,255,255,0.4);

  }

}


@keyframes glowText{

  0%,
  100%{

    text-shadow:

      0 0 8px
      rgba(255,216,74,0.25);

  }

  50%{

    text-shadow:

      0 0 14px
      rgba(255,216,74,0.60),

      0 0 28px
      rgba(57,255,106,0.20);

  }

}


@keyframes pulseDot{

  0%,
  100%{

    opacity:1;

    transform:scale(1);

  }

  50%{

    opacity:0.45;

    transform:scale(0.8);

  }

}


/* =========================================================
   CHATWEB KOMMO
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:

    rgba(0,5,2,0.97);

  visibility:hidden;

  opacity:0;

  transition:

    opacity 0.3s ease,

    visibility 0.3s ease;

  z-index:9999;

}


#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

}


/* =========================================================
   BOTÓN CERRAR CHAT
   ========================================================= */

#kommoClose{

  position:fixed;

  top:16px;

  right:16px;

  width:44px;

  height:44px;

  border:none;

  border-radius:50%;

  background:

    linear-gradient(
      135deg,
      #092010,
      #102d18
    );

  color:#39FF6A;

  font-size:20px;

  display:none;

  align-items:center;

  justify-content:center;

  z-index:10000;

  cursor:pointer;

  box-shadow:

    0 0 18px
    rgba(57,255,106,0.25),

    0 4px 15px
    rgba(0,0,0,0.5);

}


#kommoClose.is-open{

  display:flex;

}

</style>

<!-- =========================================================
     JAVASCRIPT CHATWEB
     ========================================================= -->

<script>


const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const closeBtn =
  document.getElementById(
    'kommoClose'
  );


const openBtn =
  document.getElementById(
    'openChatBtn'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT REAL
   ========================================================= */

function openReal(){

  frame.classList.add(
    'is-open'
  );


  closeBtn.classList.add(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ ChatWeb Kommo abierto'
    );


  }catch(e){

    console.log(
      '❌ Error abriendo ChatWeb:',
      e
    );

  }

}


/* =========================================================
   ABRIR CHAT MANUALMENTE
   ========================================================= */

function openChat(){

  if(ready){

    openReal();

  }

}


/* =========================================================
   CERRAR CHAT
   ========================================================= */

function closeChat(){

  frame.classList.remove(
    'is-open'
  );


  closeBtn.classList.remove(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatHide'
    );

  }catch(e){}

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      150
    );

    return;

  }


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ Kommo ChatWeb listo'
      );


      /*
        ABRIR AUTOMÁTICAMENTE
        AL ENTRAR A LA PÁGINA
      */

      setTimeout(
        function(){

          openReal();

        },
        300
      );

    }
  );

}


/* =========================================================
   BOTÓN
   ========================================================= */

openBtn.addEventListener(
  'click',
  openChat
);


closeBtn.addEventListener(
  'click',
  closeChat
);


/* =========================================================
   INICIAR
   ========================================================= */

bind();


</script>
